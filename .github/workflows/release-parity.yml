name: Frozen release parity

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Exhaustive primary and repeatability parity
        run: python -m unittest discover -s tests/release_parity -v
      - name: Verify bytes and scientific contract
        run: pqid-bench verify . --full
