name: Publish evaluator container

on:
  workflow_dispatch:
  push:
    tags:
      - "evaluator-v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/elias-abebe-gasparini/pqid-bench-evaluator

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=1.0.0
            type=raw,value=frozen
          labels: |
            org.opencontainers.image.version=1.0.0
            org.opencontainers.image.title=PQID-Bench evaluator
            org.opencontainers.image.description=Pinned runtime for isolated PQID-Bench executable replay
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: docker/evaluator
          file: docker/evaluator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Verify published manifest
        run: docker buildx imagetools inspect "${IMAGE_NAME}:1.0.0"
