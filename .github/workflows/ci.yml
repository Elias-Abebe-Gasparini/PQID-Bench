name: Python package CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/quality.txt
      - name: Install quality environment
        run: |
          python -m pip install -e ".[visualization,schema]"
          python -m pip install -r requirements/quality.txt
      - name: Lint
        run: ruff check src tests examples scripts/build_social_preview.py
      - name: Type check
        run: mypy src/pqid_bench
      - name: Unit and integration coverage
        run: |
          coverage erase
          coverage run -m unittest discover -s tests/unit -v
          coverage run --append -m unittest discover -s tests/integration -v
          coverage report --fail-under=75
          coverage xml
      - name: Validate worked examples
        run: |
          python examples/reproduce_frozen.py
          python examples/plan_live_run.py --provider groq --model example/model --limit 1
          python examples/build_dashboard.py --output .quality/dashboard.html
      - name: Validate social-preview generator
        run: python scripts/build_social_preview.py --output .quality/social-preview.png

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install documentation dependencies
        run: python -m pip install ".[docs]"
      - name: Build strict documentation
        run: mkdocs build --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -v
      - name: Integration tests
        run: python -m unittest discover -s tests/integration -v
      - name: Installed command smoke test
        run: |
          pqid-bench --version
          pqid-bench reproduce --release-dir .
      - name: Source-distribution installation test
        run: |
          python -m pip install build
          python -m build --sdist
          python -m venv .sdist-venv
          .sdist-venv/bin/python -m pip install dist/*.tar.gz
          .sdist-venv/bin/pqid-bench --version
          .sdist-venv/bin/pqid-bench reproduce --release-dir .

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build pinned evaluator image
        run: |
          docker build \
            --file docker/evaluator/Dockerfile \
            --tag pqid-bench-evaluator:ci \
            .
      - name: Verify evaluator runtime imports and versions
        run: |
          docker run --rm \
            --entrypoint python \
            pqid-bench-evaluator:ci \
            -c "import dateutil, qiskit, qiskit_aer; assert dateutil.__version__ == '2.9.0.post0'; assert qiskit.__version__ == '2.1.1'; assert qiskit_aer.__version__ == '0.17.0'"
