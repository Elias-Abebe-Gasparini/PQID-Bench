name: Documentation and interactive explorer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "artifacts/analysis_154/**"
      - "artifacts/external_model_batches_154/**"
      - "artifacts/stochastic_repeatability_21x72/**"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "scripts/build_pqid_bench_ecosystem_site.py"
      - "src/pqid_bench/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install documentation and visualization dependencies
        run: python -m pip install ".[docs]"
      - name: Validate the frozen evidence tree
        run: python scripts/validate_pqid_bench_public_release.py
      - name: Test visualization contract
        run: python -m unittest tests.unit.test_visualization -v
      - name: Generate Pages-only visual assets
        run: >-
          python scripts/build_pqid_bench_ecosystem_site.py
          --release-dir .
          --output-dir docs/interactive
          --plotlyjs cdn
      - name: Build strict documentation
        run: mkdocs build --strict --site-dir site
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
