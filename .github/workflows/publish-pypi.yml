name: Publish Python distribution

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build frontend and package
        run: |
          python -m pip install build
          python -m pip install .
      - name: Release parity gate
        run: |
          python -m unittest discover -s tests/unit -v
          python -m unittest discover -s tests/integration -v
          python -m unittest discover -s tests/release_parity -v
          pqid-bench verify . --full
      - name: Build wheel and source distribution
        run: python -m build
      - name: Clean source-distribution installation test
        run: |
          python -m venv .sdist-venv
          .sdist-venv/bin/python -m pip install dist/*.tar.gz
          .sdist-venv/bin/pqid-bench --version
          .sdist-venv/bin/pqid-bench reproduce --release-dir .
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
