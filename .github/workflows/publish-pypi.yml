name: Publish Python distribution

on:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build frontend and package
        run: |
          python -m pip install build
          python -m pip install .
      - name: Verify tag and package version agree
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"python-v{version}"
          if tag != expected:
              raise SystemExit(f"Tag {tag!r} does not match package version {expected!r}")
      - name: Release parity gate
        run: |
          python -m unittest discover -s tests/unit -v
          python -m unittest discover -s tests/integration -v
          python -m unittest discover -s tests/release_parity -v
          pqid-bench verify . --full
      - name: Build wheel and source distribution
        run: python -m build
      - name: Clean source-distribution installation test
        run: |
          python -m venv .sdist-venv
          .sdist-venv/bin/python -m pip install dist/*.tar.gz
          .sdist-venv/bin/pqid-bench --version
          .sdist-venv/bin/pqid-bench reproduce --release-dir .
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Create matching GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#python-v}"
          notes="docs/RELEASE_NOTES_v${version}.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "pqid-bench ${version}" \
            --notes-file "$notes"
